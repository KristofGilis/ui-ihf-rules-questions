name: Cleanup Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete Vercel deployment
        uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          script: |
            let prNumber = parseInt(context.issue.number);
            console.log(`Cleaning up deployments for PR #${prNumber}`);
            console.log(`PR Number type: ${typeof prNumber}, value: ${prNumber}`);

            // Get all deployments for this project (query filters don't work reliably)
            // Filter manually by matching PR number from meta field if available
            const response = await fetch(
              `https://api.vercel.com/v6/deployments?projectId=${process.env.VERCEL_PROJECT_ID}&target=preview&limit=100`,
              {
                headers: {
                  'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                }
              }
            );

            const data = await response.json();

            if (data.deployments && data.deployments.length > 0) {
              let deletedCount = 0;
              let skippedCount = 0;
              
              // Delete deployments for this PR (filter manually)
              for (const deployment of data.deployments) {
                // Skip if this deployment is from a different PR
                // Note: meta.githubPr may not be set (see ci-pr-open.yml) so we may delete all previews
                const deploymentPr = deployment.meta?.githubPr ? parseInt(deployment.meta.githubPr) : null;
                console.log(`Deployment ${deployment.uid}: githubPr=${deploymentPr}, comparing with prNumber=${prNumber} (${typeof deploymentPr} vs ${typeof prNumber})`);
                if (deploymentPr && deploymentPr !== prNumber) {
                  console.log(`⊘ Skipping deployment from different PR (PR #${deploymentPr}): ${deployment.uid}`);
                  skippedCount++;
                  continue;
                }

                // This deployment is a preview - delete it
                try {
                  const deleteResponse = await fetch(
                    `https://api.vercel.com/v13/deployments/${deployment.uid}`,
                    {
                      method: 'DELETE',
                      headers: {
                        'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                      }
                    }
                  );
                  if (deleteResponse.ok) {
                    console.log(`✓ Deleted deployment: ${deployment.uid}`);
                    deletedCount++;
                  } else {
                    console.log(`✗ Failed to delete deployment ${deployment.uid}: ${deleteResponse.status}`);
                  }
                } catch (error) {
                  console.error(`✗ Error deleting deployment ${deployment.uid}:`, error);
                }
              }
              
              // Comment on PR
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🗑️ Preview deployments cleaned up (${deletedCount} deployment(s) deleted)`
              });
            } else {
              console.log('No deployments found for this PR');
            }
