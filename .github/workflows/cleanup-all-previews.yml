name: Cleanup All Preview Deployments

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (preview what would be deleted without actually deleting)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  cleanup-all-previews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete all preview deployments
        uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          script: |
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            console.log(`Starting cleanup of all preview deployments (DRY RUN: ${dryRun})`);

            // Get all deployments for this project
            const response = await fetch(
              `https://api.vercel.com/v6/deployments?projectId=${process.env.VERCEL_PROJECT_ID}&limit=100`,
              {
                headers: {
                  'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                }
              }
            );

            const data = await response.json();
            console.log(`Found ${data.deployments?.length || 0} total deployments`);

            // Log deployment details to identify which is preview vs production
            if (data.deployments) {
              console.log('\n=== Deployment Analysis ===');
              data.deployments.forEach((d, i) => {
                console.log(`[${i}] ${d.uid}`);
                console.log(`    url: ${d.url}`);
                console.log(`    target: ${d.target}`);
                console.log(`    readySubstate: ${d.readySubstate}`);
                console.log(`    aliasAssigned: ${d.aliasAssigned}`);
                console.log(`    meta: ${JSON.stringify(d.meta)}`);
              });
              console.log('');
            }

            console.log(JSON.stringify(data, null, 2));

            if (data.deployments && data.deployments.length > 0) {
              let previewCount = 0;
              let productionCount = 0;
              let deletedCount = 0;
              let failedCount = 0;

              // Delete all preview deployments (filter by production status)
              for (const deployment of data.deployments) {
                // Skip production deployments
                if (deployment.target === 'production') {
                  console.log(`⊘ Skipping production deployment: ${deployment.uid}`);
                  console.log(`   target: ${deployment.target}, readySubstate: ${deployment.readySubstate}`);
                  productionCount++;
                  continue;
                }

                // Only delete deployments with target: preview
                if (deployment.target !== 'preview') {
                  console.log(`⊘ Skipping non-preview deployment: ${deployment.uid}`);
                  console.log(`   target: ${deployment.target}, readySubstate: ${deployment.readySubstate}`);
                  continue;
                }

                previewCount++;
                const deploymentId = deployment.uid;
                console.log(`📦 Preview deployment: ${deploymentId}`);
                console.log(`   target: ${deployment.target}, readySubstate: ${deployment.readySubstate}`);
                console.log(`${dryRun ? '[DRY RUN]' : ''} Would delete preview deployment: ${deploymentId}`);
                
                // Skip actual deletion in dry run mode
                if (dryRun) {
                  deletedCount++;
                  continue;
                }

                try {
                  const deleteResponse = await fetch(
                    `https://api.vercel.com/v13/deployments/${deploymentId}`,
                    {
                      method: 'DELETE',
                      headers: {
                        'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                      }
                    }
                  );
                  
                  if (deleteResponse.ok) {
                    console.log(`✓ Deleted deployment: ${deploymentId}`);
                    deletedCount++;
                  } else {
                    console.log(`✗ Failed to delete deployment ${deploymentId}: ${deleteResponse.status}`);
                    failedCount++;
                  }
                } catch (error) {
                  console.error(`✗ Error deleting deployment ${deploymentId}:`, error);
                  failedCount++;
                }
              }

              console.log(`\n=== Cleanup Summary ===`);
              console.log(`Production deployments (preserved): ${productionCount}`);
              console.log(`Preview deployments: ${previewCount}`);
              console.log(`${dryRun ? 'Would delete' : 'Deleted'}: ${deletedCount}`);
              if (!dryRun) console.log(`Failed: ${failedCount}`);
              console.log(`DRY RUN: ${dryRun}`);
            } else {
              console.log('No deployments found for this project');
            }
