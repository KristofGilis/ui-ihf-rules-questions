name: Cleanup All Preview Deployments

on:
  workflow_dispatch:

jobs:
  cleanup-all-previews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete all preview deployments
        uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          script: |
            console.log('Starting cleanup of all preview deployments');

            // Get all deployments for this project
            const response = await fetch(
              `https://api.vercel.com/v6/deployments?projectId=${process.env.VERCEL_PROJECT_ID}&limit=100`,
              {
                headers: {
                  'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                }
              }
            );

            const data = await response.json();
            console.log(`Found ${data.deployments?.length || 0} total deployments`);

            if (data.deployments && data.deployments.length > 0) {
              let deletedCount = 0;
              let failedCount = 0;

              // Delete all preview deployments (filter by production status)
              for (const deployment of data.deployments) {
                // Skip production deployments
                if (deployment.production) {
                  console.log(`Skipping production deployment: ${deployment.uid}`);
                  continue;
                }

                const deploymentId = deployment.uid;
                console.log(`Deleting preview deployment: ${deploymentId}`);
                
                try {
                  const deleteResponse = await fetch(
                    `https://api.vercel.com/v13/deployments/${deploymentId}`,
                    {
                      method: 'DELETE',
                      headers: {
                        'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                      }
                    }
                  );
                  
                  if (deleteResponse.ok) {
                    console.log(`✓ Deleted deployment: ${deploymentId}`);
                    deletedCount++;
                  } else {
                    console.log(`✗ Failed to delete deployment ${deploymentId}: ${deleteResponse.status}`);
                    failedCount++;
                  }
                } catch (error) {
                  console.error(`✗ Error deleting deployment ${deploymentId}:`, error);
                  failedCount++;
                }
              }

              console.log(`\nCleanup summary: ${deletedCount} deleted, ${failedCount} failed`);
            } else {
              console.log('No deployments found for this project');
            }
