name: 🍎 Upload iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version, for example 1.0
        required: true
        type: string
        default: '1.0'
      build_number:
        description: Unique build number for this version
        required: true
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  IOS_BUNDLE_ID: io.github.kristofgilis.ihfrulesquiz
  IOS_TEAM_ID: XKF5T9N38M

jobs:
  upload:
    name: 📦 Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Inject app and schema versions
        env:
          APP_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]

          SCHEMA_VERSION="$(shasum -a 256 graphql/generated.ts | awk '{print substr($1, 1, 12)}')"
          sed -i '' \
            -e "s/__APP_VERSION__/${APP_VERSION}/g" \
            -e "s/__SCHEMA_VERSION__/${SCHEMA_VERSION}/g" \
            src/version.ts

          if grep -Eq '__APP_VERSION__|__SCHEMA_VERSION__' src/version.ts; then
            echo "Version placeholders remain in src/version.ts" >&2
            exit 1
          fi

      - name: 🏗 Build and sync web assets
        run: npm run mobile:sync:ios

      - name: 🔐 Sign, archive, and upload build
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          test -n "$DISTRIBUTION_CERTIFICATE_P12_BASE64"
          test -n "$DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$APP_STORE_PROFILE_BASE64"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_BASE64"

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-distribution.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-app-store-profile.plist"
          ARCHIVE_PATH="$RUNNER_TEMP/IHFRulesQuiz.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ios-export"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -rf "$EXPORT_PATH" "$ARCHIVE_PATH" "$CERTIFICATE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST" "$API_KEY_PATH" "$RUNNER_TEMP/ExportOptions.plist"
          }
          trap cleanup EXIT

          printf '%s' "$DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_STORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" | sed "s/^${IOS_TEAM_ID}\.//")
          test "$PROFILE_BUNDLE_ID" = "$IOS_BUNDLE_ID"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$API_KEY_DIRECTORY"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          openssl pkey -in "$API_KEY_PATH" -noout
          xcrun altool --generate-jwt --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" --p8-file-path "$API_KEY_PATH" >/dev/null

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>${IOS_BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH="$EXPORT_PATH/App.ipa"
          test -f "$IPA_PATH"
          unzip -t "$IPA_PATH" >/dev/null
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --p8-file-path "$API_KEY_PATH" --verbose

          rm -f "$RUNNER_TEMP/ExportOptions.plist"
