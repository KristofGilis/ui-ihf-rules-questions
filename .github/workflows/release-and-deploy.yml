name: Release and Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 22
  AZURE_WEBAPP_NAME: rulequestions

jobs:
  release:
    runs-on: ubuntu-latest
    # Only create release when triggered by PR merge (has pull_requests context)
    # and creator is not renovate[bot]
    if: |
      github.event.pull_requests != null &&
      github.event.pull_requests[0].user.login != 'renovate[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if commit is from Renovate
        id: check_renovate
        run: |
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          if [[ "$COMMIT_AUTHOR" == "renovate[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_renovate.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.check_renovate.outputs.skip == 'false'
        run: npm ci

      - name: Semantic Release
        if: steps.check_renovate.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build:
    runs-on: ubuntu-latest
    needs: release
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build -- --configuration=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/ui-ihf-rules-questions/browser
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: ${{ github.workspace }}/dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/dist
          clean: true
          startup-command: pm2 serve /home/site/wwwroot --no-daemon --spa
