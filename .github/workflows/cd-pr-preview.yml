name: CD - Preview Deployment (PR)

on:
  workflow_run:
    workflows: [CI - PR Open]
    types: [completed]

env:
  NODE_VERSION: 22

jobs:
  preview:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor != 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ github.workspace }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Update CSP for Vercel deployment
        run: |
          sed -i 's|script-src '"'"'self'"'"' https://\*\.sentry\.io|script-src '"'"'self'"'"' '"'"'unsafe-inline'"'"' https://*.sentry.io https://vercel.live|g' ${{ github.workspace }}/dist/index.html
          sed -i 's|connect-src '"'"'self'"'"' https://api-ihf-rules-questions\.azurewebsites\.net https://\*\.sentry\.io|connect-src '"'"'self'"'"' https://api-ihf-rules-questions.azurewebsites.net https://*.sentry.io https://vercel.live|g' ${{ github.workspace }}/dist/index.html
          sed -i 's|form-action '"'"'self'"'"';|form-action '"'"'self'"'"'; frame-src https://vercel.live;|g' ${{ github.workspace }}/dist/index.html

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd ${{ github.workspace }}/dist
          PREVIEW_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = '${{ steps.deploy-vercel.outputs.preview-url }}';
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const commentBody = `��� Preview deployment ready!\n\n��� **Preview URL**: ${previewUrl}\n\n✨ Deployed with Vercel (free tier)\n\n_This preview will be automatically deleted when the PR is closed._`;

            const comments = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('��� Preview deployment ready!')
            );

            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id
              });
            }

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
