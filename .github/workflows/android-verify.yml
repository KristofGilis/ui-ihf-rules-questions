name: Android native checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-verify.yml'
      - 'android/**'
      - 'native/content.json'
      - 'native/strings.json'
      - 'ios/App/App/OfflineContent/content.sqlite'
      - 'ios/App/App/OfflineContent/AppInformation.json'
      - 'scripts/native-content.py'
      - 'scripts/prepare-android-content.py'
      - 'scripts/generate-native-branding.mjs'
      - 'ios/App/App/Assets.xcassets/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-verify.yml'
      - 'android/**'
      - 'native/content.json'
      - 'native/strings.json'
      - 'ios/App/App/OfflineContent/content.sqlite'
      - 'ios/App/App/OfflineContent/AppInformation.json'
      - 'scripts/native-content.py'
      - 'scripts/prepare-android-content.py'
      - 'scripts/generate-native-branding.mjs'
      - 'ios/App/App/Assets.xcassets/**'

permissions:
  contents: read

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate shared offline content
        run: python3 scripts/native-content.py --check
      - name: Prepare Android content and branding assets
        run: python3 scripts/prepare-android-content.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and lint Android app
        run: bash android/gradlew -p android lintDebug assembleDebug assembleRelease bundleRelease
