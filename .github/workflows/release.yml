name: 🚀 Stable Release

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 22
  AZURE_WEBAPP_NAME: rulequestions

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          npx semantic-release
          LATEST_TAG_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$LATEST_TAG_BEFORE" != "$LATEST_TAG_AFTER" ] && [ -n "$LATEST_TAG_AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$LATEST_TAG_AFTER" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=''" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: 🏷 Get version from Git tag
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" src/version.ts
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" ngsw-config.json
          SCHEMA_VERSION=$(sha256sum graphql/generated.ts | cut -c1-12)
          sed -i "s/__SCHEMA_VERSION__/${SCHEMA_VERSION}/g" src/version.ts

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗 Build application
        run: npm run build -- --configuration=production

      - name: 📦 Stage deployment package
        run: |
          # Layout shipped to Azure App Service wwwroot:
          #   ./server.mjs              ← static server (compression + serve-handler)
          #   ./package.json            ← runtime deps only (compression, serve-handler)
          #   ./node_modules/           ← pre-installed runtime deps
          #   ./browser/                ← Angular build output incl. serve.json
          # We install node_modules in CI because azure/webapps-deploy@v3 does
          # NOT trigger Oryx build, so node_modules must be shipped or `npm start`
          # would fail with MODULE_NOT_FOUND and App Service returns 503.
          mkdir -p deploy-pkg
          cp server.mjs deploy-pkg/server.mjs
          cp deploy/package.json deploy-pkg/package.json
          cp -r dist/ui-ihf-rules-questions/browser deploy-pkg/browser
          (cd deploy-pkg && npm install --omit=dev --no-audit --no-fund --ignore-scripts)

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: deploy-pkg
          retention-days: 1

  deploy:
    name: 🚀 Deploy ${{ needs.release.outputs.new-release-version }}
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: ⬇️ Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: ${{ github.workspace }}/dist

      - name: 🔑 Azure Login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/dist
          clean: true
          # node_modules is bundled in the artifact (Oryx build is not run),
          # so App Service can directly invoke `npm start` → `node server.mjs`.
          startup-command: 'npm start'
