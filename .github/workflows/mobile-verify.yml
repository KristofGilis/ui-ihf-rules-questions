name: Native iOS checks

on:
  workflow_dispatch:
    inputs:
      store_screenshots_only:
        description: Capture Dutch and French store journeys without rerunning the full suite
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-verify.yml'
      - '.github/workflows/ios-testflight-upload.yml'
      - 'ios/**'
      - 'native/**'
      - 'scripts/native-content.py'
      - 'scripts/generate-native-ios-project.py'
      - 'scripts/generate-native-branding.mjs'
      - 'scripts/compose-native-ball.mjs'
      - 'scripts/test_native_content.py'
      - 'scripts/apple-testflight.py'
      - 'scripts/test_apple_testflight.py'

permissions:
  contents: read

jobs:
  content:
    name: Offline content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/native-content.py --check
      - run: python3 scripts/test_native_content.py
      - run: python3 scripts/test_apple_testflight.py
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-native-ios-project.py
          git diff --exit-code -- ios/App/App.xcodeproj ios/App/App/OfflineContent/InterfaceStrings.json

  ios:
    name: iOS ${{ matrix.device }} build and tests
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      DEVICE_FAMILY: ${{ matrix.device }}
      STORE_SCREENSHOTS_ONLY: ${{ inputs.store_screenshots_only || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify bundled content
        run: python3 scripts/native-content.py --check
      - name: Test native app on ${{ matrix.device }} simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; family=os.environ["DEVICE_FAMILY"]; devices=json.load(sys.stdin)["devices"]; matches=[d for group in devices.values() for d in group if family in d["name"] and d.get("isAvailable",False)]; preferred=[d for d in matches if "13-inch" in d["name"] or "12.9-inch" in d["name"]]; print((preferred or matches)[0]["udid"])')"
          # bootstatus also verifies readiness if the simulator was already booted.
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          TEST_ARGUMENTS=()
          if [[ "$STORE_SCREENSHOTS_ONLY" == 'true' ]]; then
            TEST_ARGUMENTS+=(-only-testing:AppUITests/NativeLayoutUITests/testLocalizedStoreScreenshots)
          fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/native-ios" CODE_SIGNING_ALLOWED=NO "${TEST_ARGUMENTS[@]}" test
