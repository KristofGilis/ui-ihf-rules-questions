name: Native iOS checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-verify.yml'
      - '.github/workflows/ios-testflight-upload.yml'
      - 'ios/**'
      - 'native/**'
      - 'scripts/native-content.py'
      - 'scripts/generate-native-ios-project.py'
      - 'scripts/test_native_content.py'

permissions:
  contents: read

jobs:
  content:
    name: Offline content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/native-content.py --check
      - run: python3 scripts/test_native_content.py
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-native-ios-project.py
          git diff --exit-code -- ios/App/App.xcodeproj

  ios:
    name: iOS simulator build and tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify bundled content
        run: python3 scripts/native-content.py --check
      - name: Test native app on iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"] and d.get("isAvailable", False)))')"
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/native-ios" CODE_SIGNING_ALLOWED=NO test
