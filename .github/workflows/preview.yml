name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

env:
  NODE_VERSION: 22

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.actor != 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: ${{ github.workspace }}/dist

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Update CSP for Vercel deployment
        run: |
          sed -i 's|script-src '\''self'\'' https://\*\.sentry\.io|script-src '\''self'\'' '\''unsafe-inline'\'' https://*.sentry.io https://vercel.live|g' ${{ github.workspace }}/dist/browser/index.html
          sed -i 's|connect-src '\''self'\'' https://api-ihf-rules-questions\.azurewebsites\.net https://\*\.sentry\.io|connect-src '\''self'\'' https://api-ihf-rules-questions.azurewebsites.net https://*.sentry.io https://vercel.live|g' ${{ github.workspace }}/dist/browser/index.html
          sed -i 's|form-action '\''self'\'';|form-action '\''self'\''; frame-src https://vercel.live;|g' ${{ github.workspace }}/dist/browser/index.html

      - name: Copy vercel.json to dist
        run: cp vercel.json ${{ github.workspace }}/dist/browser/vercel.json

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd ${{ github.workspace }}/dist/browser
          PREVIEW_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = '${{ steps.deploy-vercel.outputs.preview-url }}';
            const commentBody = `🚀 Preview deployment ready!\n\n📱 **Preview URL**: ${previewUrl}\n\n✨ Deployed with Vercel (free tier)\n\n_This preview will be automatically deleted when the PR is closed._`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Preview deployment ready!')
            );

            if (botComment) {
              // Delete old comment
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id
              });
            }

            // Create new comment (always at the bottom)
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.actor != 'renovate[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Delete Vercel deployment
        uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            console.log(`Cleaning up deployments for PR #${prNumber}`);

            // Get all deployments for this project
            const response = await fetch(
              `https://api.vercel.com/v6/deployments?projectId=${process.env.VERCEL_PROJECT_ID}&meta-githubPullRequest=${prNumber}`,
              {
                headers: {
                  'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                }
              }
            );

            const data = await response.json();

            if (data.deployments && data.deployments.length > 0) {
              // Delete all deployments for this PR
              for (const deployment of data.deployments) {
                await fetch(
                  `https://api.vercel.com/v13/deployments/${deployment.uid}`,
                  {
                    method: 'DELETE',
                    headers: {
                      'Authorization': `Bearer ${process.env.VERCEL_TOKEN}`
                    }
                  }
                );
                console.log(`Deleted deployment: ${deployment.uid}`);
              }
              
              // Comment on PR
              github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🗑️ Preview deployments cleaned up (${data.deployments.length} deployment(s) deleted)`
              });
            } else {
              console.log('No deployments found for this PR');
            }
