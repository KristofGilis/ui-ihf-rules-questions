name: ✅ Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  validate-pr-title:
    name: 📝 Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  validate:
    name: 🛠 Build & Validate
    runs-on: ubuntu-latest
    needs: validate-pr-title
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🏗 Build application
        run: npm run build -- --configuration=production

      - name: 📦 Check bundle size
        run: |
          MAIN_SIZE=$(find dist/ui-ihf-rules-questions/browser -name 'main*.js' -exec wc -c {} \; | awk '{print $1}')
          MAX_SIZE=350000
          echo "Main bundle size: $MAIN_SIZE bytes (max: $MAX_SIZE bytes)"
          if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size exceeds limit!"
            exit 1
          fi
          echo "✅ Bundle size is within limits"
