name: CI - Push to Main

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 22
  AZURE_WEBAPP_NAME: rulequestions

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build application
        run: npm run build -- --configuration=production

      - name: Check bundle size
        run: |
          MAIN_SIZE=$(find dist/ui-ihf-rules-questions/browser -name 'main*.js' -exec wc -c {} \; | awk '{print $1}')
          MAX_SIZE=350000
          echo "Main bundle size: $MAIN_SIZE bytes (max: $MAX_SIZE bytes)"
          if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size exceeds limit!"
            exit 1
          fi
          echo "✅ Bundle size is within limits"

      - name: Run tests
        run: npm test -- --coverage --silent

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e --ignore-scripts

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/ui-ihf-rules-questions/browser
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ github.workspace }}/dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/dist
          clean: true
          startup-command: pm2 serve /home/site/wwwroot --no-daemon --spa
