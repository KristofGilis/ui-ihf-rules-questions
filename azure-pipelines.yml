trigger:
  - main

variables:
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  azureSubscription: sc-ihf-rules-questions
  azureWebAppName: rulequestions

stages:
  - stage: Build
    displayName: Build image
    jobs:
      - job: Build
        displayName: Build image
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: Npm@1
            displayName: npm install
            inputs:
              command: 'install'
          - task: Npm@1
            displayName: npm build
            inputs:
              command: 'custom'
              customCommand: 'run build -- --configuration=production'
          - task: CopyFiles@2
            condition: and(succeeded(), eq(variables.isMain, true))
            displayName: 'Copy files to artifact staging directory'
            inputs:
              SourceFolder: dist/ui-ihf-rules-questions/browser
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              OverWrite: true
          - task: PublishBuildArtifacts@1
            condition: and(succeeded(), eq(variables.isMain, true))
            displayName: 'Publish artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
  - stage: deploy
    condition: and(succeeded(), eq(variables.isMain, true))
    displayName: Deploy image
    jobs:
      - job: Deploy
        displayName: Deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'
          - task: ArchiveFiles@2
            displayName: 'Create deployment zip'
            inputs:
              rootFolderOrFile: '$(System.ArtifactsDirectory)/drop'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(System.ArtifactsDirectory)/app.zip'
              replaceExistingArchive: true
          - task: AzureRmWebAppDeployment@4
            displayName: Deploy Azure Web App
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              WebAppName: $(azureWebAppName)
              packageForLinux: '$(System.ArtifactsDirectory)/app.zip'
