query getQuestions($first: Int!, $after: String, $order: [QuestionSortInput!], $random: Boolean = false) {
  questions(first: $first, after: $after, order: $order, random: $random) {
    edges {
      cursor
      node {
        id
        number
        phrase
        translations
        ruleId
        ruleReferences
        answers(order: { number: ASC }) {
          nodes {
            id
            number
            phrase
            translations
            isCorrect
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
