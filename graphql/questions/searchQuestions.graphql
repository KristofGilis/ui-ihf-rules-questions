query searchQuestions($searchTerm: String!, $first: Int, $after: String) {
  searchQuestions(searchTerm: $searchTerm, first: $first, after: $after) {
    edges {
      node {
        id
        number
        phrase
        translations
        ruleId
        ruleReferences
        answers(order: { number: ASC }) {
          nodes {
            id
            number
            phrase
            translations
            isCorrect
          }
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
