query prefetchQuestions($cursor: String) {
  questions(first: 50, after: $cursor, order: [{ number: ASC }], random: false) {
    edges {
      cursor
      node {
        id
        number
        phrase
        translations
        ruleId
        ruleReferences
        answers(order: { number: ASC }) {
          nodes {
            id
            number
            phrase
            translations
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
