query getRule($id: ID!, $first: Int!, $after: String) {
  ruleById(id: $id) {
    id
    number
    name
    translations
    questions(first: $first, after: $after, order: [{ number: ASC }]) {
      edges {
        cursor
        node {
          id
          number
          phrase
          translations
          answers(order: [{ number: ASC }]) {
            nodes {
              id
              number
              phrase
              translations
            }
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
