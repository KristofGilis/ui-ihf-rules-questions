<div class="container-fluid h-100">
  <div class="row">
    <div class="col">
      <h4>
        @if (random().isRandom) {
          {{ 'random_questions.title' | translate }}
        } @else {
          {{ 'questions.title' | translate }}
        }
      </h4>

      <app-questions-view
        [questions]="(questions$ | async) ?? []"
        [loading]="loading()"
        [hasMoreQuestions]="hasMoreQuestions"
        [score]="(score$ | async) ?? undefined"
        [scoreLoading]="scoreLoading()"
        [isRandom]="random().isRandom"
        [randomCount]="random().count"
        (calculareScore)="onCalculateScore($event.questionIds, $event.selectedAnswerIds)"
        (newRandomQuestions)="onNewRandomQuestions()" />
    </div>
  </div>
</div>
