<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-lg dark:border-slate-800 dark:bg-slate-900">
  <h4 class="mb-4 text-xl font-bold text-slate-900 dark:text-white">{{ 'score_overview.title' | translate }}</h4>

  <div class="mb-4">
    <div class="mb-2 text-slate-600 dark:text-slate-400">
      {{ 'score_overview.score' | translate }}
      <span class="ml-2 text-xl font-bold text-slate-900 dark:text-white"
        >{{ score()?.score }} / {{ score()?.total }}</span
      >
    </div>
    <div
      class="inline-flex items-center gap-2 rounded-xl bg-linear-to-br px-4 py-2 text-3xl font-bold text-white shadow-md"
      [class.from-red-500]="isBadResult()"
      [class.to-red-600]="isBadResult()"
      [class.from-green-500]="!isBadResult()"
      [class.to-green-600]="!isBadResult()">
      {{ score()?.percentage }}
    </div>
  </div>

  @if (score()?.wrongQuestionsIds?.length ?? 0 > 0) {
    <div class="mt-4 border-t border-slate-200 pt-4 dark:border-slate-700">
      <span
        class="mb-2 block text-slate-600 dark:text-slate-400"
        [innerHTML]="'score_overview.wrong_questionNumbers' | translate"></span>
      <div class="flex flex-wrap gap-2">
        @for (wrongQuestionId of score()?.wrongQuestionsIds; track wrongQuestionId) {
          <button
            type="button"
            class="flex cursor-pointer items-center gap-1 rounded bg-red-100 px-2 py-1 text-red-600 transition-all duration-200 hover:bg-red-200 hover:shadow-md dark:bg-red-950 dark:text-red-400 dark:hover:bg-red-900"
            (click)="onQuestionClick(wrongQuestionId)">
            <fa-icon [icon]="faTimesCircle"></fa-icon>
            <span>{{ getQuestionNumber(wrongQuestionId) }}</span>
          </button>
        }
      </div>
    </div>
  }
</div>
