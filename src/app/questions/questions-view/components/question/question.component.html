<div class="group rounded-2xl border border-slate-200 bg-white p-6 shadow-lg transition-all duration-300 hover:shadow-xl dark:border-slate-800 dark:bg-slate-900">
  <div class="mb-4">
    <span class="mr-2 font-bold text-slate-900 dark:text-white">{{ question().number }})</span>
    <span class="text-slate-700 dark:text-slate-300" [innerHTML]="question().phrase"></span>
  </div>

  <div class="space-y-3">
    @for (answer of question().answers?.nodes; track answer?.id) {
      <label
        class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 p-4 transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-cyan-500 dark:hover:bg-slate-700">
        <input
          type="checkbox"
          class="mt-1 h-5 w-5 cursor-pointer rounded border-slate-300 text-cyan-600 focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 dark:border-slate-600 dark:bg-slate-700 dark:focus:ring-offset-slate-900"
          (change)="onCheckboxChange(answer?.id ?? '', $any($event.target).checked)" />
        <span class="flex-1 text-slate-700 dark:text-slate-300">
          <span class="mr-2 font-medium">{{ answer?.number }})</span>
          {{ answer?.phrase }}
        </span>
      </label>
    }
  </div>
</div>
