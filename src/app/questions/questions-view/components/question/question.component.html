<div class="question-container">
  <div class="question-header">
    <span class="question-number">{{ question().number }})</span>
    <span class="question-text" [innerHTML]="question().phrase"></span>
  </div>

  <div class="answers-container">
    @for (answer of question().answers?.nodes; track answer?.id) {
      <label class="answer-option" [class.selected]="selectedAnswers().includes(answer?.id ?? '')">
        <input
          type="checkbox"
          class="answer-checkbox"
          [checked]="selectedAnswers().includes(answer?.id ?? '')"
          (change)="onAnswerChange($event, answer?.id ?? '')"
          [disabled]="showFeedback()" />
        <span class="answer-content">
          <span class="answer-number">{{ answer?.number }})</span>
          <span class="answer-text">{{ answer?.phrase }}</span>
        </span>
        @if (showFeedback() && selectedAnswers().includes(answer?.id ?? '')) {
          <i class="fa-solid fa-check answer-icon"></i>
        }
      </label>
    }
  </div>
</div>
