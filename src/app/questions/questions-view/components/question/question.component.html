<div class="card p-6">
  <div class="mb-4">
    <span class="font-bold mr-2">{{ question().number }})</span>
    <span class="text-white/90" [innerHTML]="question().phrase"></span>
  </div>

  <div class="space-y-2">
    @for (answer of question().answers?.nodes; track answer?.id) {
      <label class="flex items-start gap-3 p-3 rounded-lg border border-white/10 hover:bg-white/5 cursor-pointer transition-colors">
        <input
          type="checkbox"
          class="mt-1 rounded"
          (change)="onCheckboxChange(answer?.id ?? '', $any($event.target).checked)" />
        <span class="text-white/90 flex-1">
          <span class="font-medium mr-2">{{ answer?.number }})</span>
          {{ answer?.phrase }}
        </span>
      </label>
    }
  </div>
</div>
