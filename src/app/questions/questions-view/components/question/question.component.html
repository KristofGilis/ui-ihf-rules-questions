<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 p-6">
  <div class="mb-4">
    <span class="font-semibold text-gray-900 dark:text-white">{{ question().number }}) </span>
    <span class="font-semibold text-gray-900 dark:text-white" [innerHTML]="question().phrase"></span>
  </div>

  <div class="space-y-3">
    @for (answer of question().answers?.nodes; track answer?.id) {
      <label class="flex items-start gap-3 p-3 rounded-md border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors">
        <input
          type="checkbox"
          [checked]="isAnswerSelected(answer?.id ?? '')"
          (change)="toggleAnswer(answer?.id ?? '', $event)"
          class="mt-1 h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-2 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 cursor-pointer">
        <span class="flex-1 text-gray-700 dark:text-gray-300">
          <span class="font-medium">{{ answer?.number }})</span>
          {{ answer?.phrase }}
        </span>
      </label>
    }
  </div>
</div>
