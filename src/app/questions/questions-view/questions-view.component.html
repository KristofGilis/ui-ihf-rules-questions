@for (question of questions(); track question.id) {
  <div class="mb-4 fade-in">
    <app-question
      [question]="question"
      (selectAnswer)="onSelectAnswer($event)"
      (deselectAnswer)="onDeselectAnswer($event)" />
  </div>
}

@if (loading()) {
  <div class="flex justify-center items-center py-8">
    <fa-icon [icon]="faSpinner" [animation]="'spin'" size="2x" class="text-purple-400"></fa-icon>
  </div>
}

@if (!hasMoreQuestions() && !loading()) {
  <div class="flex gap-3 mt-6">
    <button type="button" 
            class="btn-primary flex-1 disabled:opacity-50 disabled:cursor-not-allowed" 
            [disabled]="scoreLoading()" 
            (click)="onCalculateScore()">
      {{ 'questions.calculate_score' | translate }}
      @if (scoreLoading()) {
        <fa-icon [icon]="faSpinner" [animation]="'spin'" class="ml-2"></fa-icon>
      }
    </button>
    @if (isRandom()) {
      <button type="button" 
              class="btn-secondary flex-1 disabled:opacity-50 disabled:cursor-not-allowed" 
              [disabled]="scoreLoading()" 
              (click)="newRandomQuestions.emit()">
        <fa-icon [icon]="faRedo" class="mr-2"></fa-icon>
        {{ 'questions_random_new' | translate: { count: randomCount() } }}
      </button>
    }
  </div>
}

@if (score()) {
  <div class="mt-6 fade-in">
    <app-score-overview [score]="score()" [questions]="questions()" />
  </div>
}
