@for (question of questions(); track question.id) {
  <div class="mb-4">
    <app-question
      [question]="question"
      (selectAnswer)="onSelectAnswer($event)"
      (deselectAnswer)="onDeselectAnswer($event)" />
  </div>
}
@if (loading()) {
  <div class="loading">
    <fa-icon [icon]="faSpinner" [spin]="true" size="2x"></fa-icon>
  </div>
}
@if (!hasMoreQuestions() && !loading()) {
  <div class="actions">
    <button type="button" class="btn btn-primary" [disabled]="scoreLoading()" (click)="onCalculateScore()">
      {{ 'questions.calculate_score' | translate }}
      @if (scoreLoading()) {
        <fa-icon [icon]="faSpinner" [spin]="true" class="ml-2"></fa-icon>
      }
    </button>
    @if (isRandom()) {
      <button type="button" class="btn btn-secondary" [disabled]="scoreLoading()" (click)="newRandomQuestions.emit()">
        <fa-icon [icon]="faRedo"></fa-icon>
        {{ 'questions_random_new' | translate: { count: randomCount() } }}
      </button>
    }
  </div>
}
@if (score()) {
  <div class="score-section">
    <app-score-overview [score]="score()" [questions]="questions()" />
  </div>
}
