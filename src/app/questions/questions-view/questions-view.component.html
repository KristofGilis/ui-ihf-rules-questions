<div class="space-y-6">
  @for (question of questions(); track question.id) {
    <div class="fade-in">
      <app-question
        [question]="question"
        (selectAnswer)="onSelectAnswer($event)"
        (deselectAnswer)="onDeselectAnswer($event)" />
    </div>
  }

  @if (loading()) {
    <div class="flex items-center justify-center py-8">
      <fa-icon [icon]="faSpinner" [animation]="'spin'" size="2x" class="text-cyan-500"></fa-icon>
    </div>
  }

  @if (!hasMoreQuestions() && !loading()) {
    <div class="flex flex-col gap-3 sm:flex-row">
      <button
        type="button"
        class="group flex flex-1 items-center justify-center gap-2 rounded-xl bg-linear-to-br from-cyan-500 to-blue-500 px-6 py-3 font-semibold text-white shadow-lg transition-all duration-200 hover:scale-105 hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100"
        [disabled]="scoreLoading()"
        (click)="onCalculateScore()">
        {{ 'questions.calculate_score' | translate }}
        @if (scoreLoading()) {
          <fa-icon [icon]="faSpinner" [animation]="'spin'"></fa-icon>
        }
      </button>
      @if (isRandom()) {
        <button
          type="button"
          class="group flex flex-1 items-center justify-center gap-2 rounded-xl border-2 border-cyan-500 bg-transparent px-6 py-3 font-semibold text-cyan-600 transition-all duration-200 hover:bg-cyan-500 hover:text-white disabled:cursor-not-allowed disabled:opacity-50 dark:text-cyan-400 dark:hover:text-white"
          [disabled]="scoreLoading()"
          (click)="newRandomQuestions.emit()">
          <fa-icon [icon]="faRedo"></fa-icon>
          {{ 'questions_random_new' | translate: { count: randomCount() } }}
        </button>
      }
    </div>
  }

  @if (score()) {
    <div class="fade-in">
      <app-score-overview [score]="score()" [questions]="questions()" />
    </div>
  }
</div>
