<div class="questions-view-container">
  @for (question of questions(); track question.id) {
    <app-question
      [question]="question"
      [selectedAnswers]="selectedAnswers"
      [showFeedback]="!!score()"
      (selectAnswer)="onSelectAnswer($event)"
      (deselectAnswer)="onDeselectAnswer($event)" />
  }
  
  @if (loading()) {
    <div class="loading-container">
      <div class="spinner"></div>
      <p class="loading-text">Loading questions...</p>
    </div>
  }
  
  @if (!hasMoreQuestions() && !loading() && !score()) {
    <div class="actions-container">
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="scoreLoading()"
        (click)="onCalculateScore()">
        @if (scoreLoading()) {
          <div class="spinner-small"></div>
        }
        {{ 'questions.calculate_score' | translate }}
        <i class="fa-solid fa-calculator"></i>
      </button>
      
      @if (isRandom()) {
        <button
          type="button"
          class="btn btn-secondary"
          [disabled]="scoreLoading()"
          (click)="newRandomQuestions.emit()">
          <i class="fa-solid fa-rotate"></i>
          {{ 'questions_random_new' | translate: { count: randomCount() } }}
        </button>
      }
    </div>
  }
  
  @if (score()) {
    <app-score-overview [score]="score()" [questions]="questions()" />
  }
</div>
