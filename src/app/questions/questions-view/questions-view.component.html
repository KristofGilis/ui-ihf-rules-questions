<div class="space-y-6">
  @for (question of questions(); track question.id) {
    <div>
      <app-question
        [question]="question"
        (selectAnswer)="onSelectAnswer($event)"
        (deselectAnswer)="onDeselectAnswer($event)" />
    </div>
  }
  
  @if (loading()) {
    <div class="flex justify-center items-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
    </div>
  }
  
  @if (!hasMoreQuestions() && !loading()) {
    <div class="flex flex-col sm:flex-row gap-3 justify-end">
      <button
        type="button"
        [disabled]="scoreLoading()"
        (click)="onCalculateScore()"
        class="px-6 py-3 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-400 dark:bg-primary-500 dark:hover:bg-primary-600 text-white font-medium rounded-md transition-colors disabled:cursor-not-allowed flex items-center justify-center gap-2">
        {{ 'questions.calculate_score' | translate }}
        @if (scoreLoading()) {
          <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
        }
      </button>
      @if (isRandom()) {
        <button 
          type="button" 
          [disabled]="scoreLoading()" 
          (click)="newRandomQuestions.emit()"
          class="px-6 py-3 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-medium rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ 'questions_random_new' | translate: { count: randomCount() } }}
        </button>
      }
    </div>
  }
  
  @if (score()) {
    <div class="mt-6">
      <app-score-overview [score]="score()" [questions]="questions()" />
    </div>
  }
</div>
