@for (question of questions(); track question.id) {
  <div class="mb-4">
    <app-question
      [question]="question"
      (selectAnswer)="onSelectAnswer($event)"
      (deselectAnswer)="onDeselectAnswer($event)" />
  </div>
}
@if (loading()) {
  <div class="flex justify-center items-center py-8">
    <fa-icon [icon]="faSpinner" [animation]="'spin'" size="2x" class="text-blue-600"></fa-icon>
  </div>
}
@if (!hasMoreQuestions() && !loading()) {
  <div class="flex gap-3 mt-6">
    <button type="button" class="flex-1 font-medium py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white disabled:opacity-50 disabled:cursor-not-allowed" 
            [disabled]="scoreLoading()" (click)="onCalculateScore()">
      {{ 'questions.calculate_score' | translate }}
      @if (scoreLoading()) {
        <fa-icon [icon]="faSpinner" [animation]="'spin'" class="ml-2"></fa-icon>
      }
    </button>
    @if (isRandom()) {
      <button type="button" class="flex-1 font-medium py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 bg-gray-600 hover:bg-gray-700 text-white disabled:opacity-50 disabled:cursor-not-allowed" 
              [disabled]="scoreLoading()" (click)="newRandomQuestions.emit()">
        <fa-icon [icon]="faRedo"></fa-icon>
        {{ 'questions_random_new' | translate: { count: randomCount() } }}
      </button>
    }
  </div>
}
@if (score()) {
  <div class="mt-6">
    <app-score-overview [score]="score()" [questions]="questions()" />
  </div>
}
