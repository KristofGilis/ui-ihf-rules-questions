<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <app-logo class="header-logo" />
      <h1 class="header-title">{{ 'main.title' | translate }}</h1>
      
      <!-- Language selector for desktop -->
      <div class="language-selector">
        <select
          [(ngModel)]="currentLang"
          (change)="onChangeLanguage(currentLang)"
          class="language-select"
          [attr.aria-label]="'languages.label' | translate">
          <option value="en">{{ 'languages.en' | translate }}</option>
          <option value="nl">{{ 'languages.nl' | translate }}</option>
          <option value="srb">{{ 'languages.srb' | translate }}</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main content area -->
  <main class="app-main">
    <div class="container">
      <router-outlet />
    </div>
  </main>

  <!-- Bottom navigation for mobile -->
  <nav class="bottom-nav">
    @for (item of rootRoutes; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item"
        (click)="onNavigationLinkClicked(item.path)">
        <i class="nav-icon" [ngClass]="{
          'fa-solid fa-house': item.path === 'home',
          'fa-solid fa-book': item.path === 'rules',
          'fa-solid fa-circle-question': item.path === 'questions'
        }"></i>
        <span class="nav-label">{{ 'navigation.' + item.path | translate }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <footer class="app-footer">
    <p class="footer-text">&copy; Copyright 2025, Kristof Gilis</p>
  </footer>
</div>
