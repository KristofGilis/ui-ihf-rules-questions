<div class="flex flex-col min-h-screen pb-16 bg-gray-50 dark:bg-gray-900">
  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10 shadow-sm">
    <div class="px-4 py-3 flex items-center justify-between max-w-7xl mx-auto">
      <div class="flex items-center gap-3">
        <app-logo class="h-8 w-8" />
        <h1 class="text-lg font-bold text-gray-900 dark:text-white m-0">{{ 'main.title' | translate }}</h1>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Language selector -->
        <select
          [(ngModel)]="currentLang"
          (change)="onChangeLanguage(currentLang)"
          class="px-2 py-1 text-sm border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
          [attr.aria-label]="'languages.label' | translate">
          <option value="en">{{ 'languages.en' | translate }}</option>
          <option value="nl">{{ 'languages.nl' | translate }}</option>
          <option value="srb">{{ 'languages.srb' | translate }}</option>
        </select>
        
        <!-- Theme toggle -->
        <button
          (click)="themeService.toggleTheme()"
          class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          type="button"
          [attr.aria-label]="'theme.toggle' | translate"
          [attr.title]="'theme.toggle' | translate">
          <fa-icon [icon]="getThemeIcon()" />
        </button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>

  <!-- Bottom navigation (mobile) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around py-2 md:hidden shadow-lg">
    <a routerLink="/home" routerLinkActive="text-blue-600 dark:text-blue-400 font-semibold" [routerLinkActiveOptions]="{exact: true}"
       class="flex flex-col items-center gap-1 px-3 py-2 text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors no-underline">
      <fa-icon [icon]="faHome" />
      <span class="text-xs">{{ 'navigation.home' | translate }}</span>
    </a>
    <a routerLink="/quiz" routerLinkActive="text-blue-600 dark:text-blue-400"
       class="flex flex-col items-center gap-1 px-3 py-2 text-gray-600 dark:text-gray-400 transition-colors no-underline">
      <fa-icon [icon]="faTrophy" />
      <span class="text-xs">{{ 'navigation.quiz' | translate }}</span>
    </a>
    <a routerLink="/questions" routerLinkActive="text-blue-600 dark:text-blue-400 font-semibold"
       class="flex flex-col items-center gap-1 px-3 py-2 text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors no-underline">
      <fa-icon [icon]="faQuestionCircle" />
      <span class="text-xs">{{ 'navigation.questions' | translate }}</span>
    </a>
    <a routerLink="/rules" routerLinkActive="text-blue-600 dark:text-blue-400 font-semibold"
       class="flex flex-col items-center gap-1 px-3 py-2 text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors no-underline">
      <fa-icon [icon]="faBook" />
      <span class="text-xs">{{ 'navigation.rules' | translate }}</span>
    </a>
  </nav>
</div>
