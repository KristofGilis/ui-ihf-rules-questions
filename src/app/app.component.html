<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <app-logo class="logo" />
        <h1 class="title">{{ 'main.title' | translate }}</h1>
      </div>
      
      <div class="header-right">
        <!-- Language selector -->
        <select
          [(ngModel)]="currentLang"
          (change)="onChangeLanguage(currentLang)"
          class="language-select"
          [attr.aria-label]="'languages.label' | translate">
          <option value="en">{{ 'languages.en' | translate }}</option>
          <option value="nl">{{ 'languages.nl' | translate }}</option>
          <option value="srb">{{ 'languages.srb' | translate }}</option>
        </select>
        
        <!-- Theme toggle -->
        <button
          (click)="themeService.toggleTheme()"
          class="theme-toggle"
          type="button"
          [attr.aria-label]="'theme.toggle' | translate"
          [attr.title]="'theme.toggle' | translate">
          <fa-icon [icon]="getThemeIcon()" />
        </button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
       class="nav-item">
      <fa-icon [icon]="faHome" />
      <span>{{ 'navigation.home' | translate }}</span>
    </a>
    <a routerLink="/quiz" routerLinkActive="active"
       class="nav-item">
      <fa-icon [icon]="faTrophy" />
      <span>{{ 'navigation.quiz' | translate }}</span>
    </a>
    <a routerLink="/questions" routerLinkActive="active"
       class="nav-item">
      <fa-icon [icon]="faQuestionCircle" />
      <span>{{ 'navigation.questions' | translate }}</span>
    </a>
    <a routerLink="/rules" routerLinkActive="active"
       class="nav-item">
      <fa-icon [icon]="faBook" />
      <span>{{ 'navigation.rules' | translate }}</span>
    </a>
  </nav>
</div>
