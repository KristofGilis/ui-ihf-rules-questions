@if (loading()) {
  <div class="flex justify-center items-center py-8">
    <fa-icon [icon]="faSpinner" [animation]="'spin'" size="2x" class="text-purple-400"></fa-icon>
  </div>
} @else {
  <div class="space-y-3">
    @for (rule of rules(); track rule.number) {
      <a [routerLink]="rule.id" 
         class="card flex items-center justify-between p-4 hover:bg-white/10 transition-colors fade-in">
        <span class="font-medium">{{ rule.number }} - {{ rule.name }}</span>
        <fa-icon [icon]="faChevronRight" class="text-white/40"></fa-icon>
      </a>
    }
  </div>
}
