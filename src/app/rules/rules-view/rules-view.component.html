@if (loading()) {
  <div class="loading">
    <fa-icon [icon]="faSpinner" [animation]="'spin'" size="2x"></fa-icon>
  </div>
} @else {
  <div class="rules-list">
    @for (rule of rules(); track rule.number) {
      <a [routerLink]="rule.id" class="rule-item">
        <span class="rule-text">{{ rule.number }} - {{ rule.name }}</span>
        <fa-icon [icon]="faChevronRight" class="rule-icon"></fa-icon>
      </a>
    }
  </div>
}
