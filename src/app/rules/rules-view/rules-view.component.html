@if (loading()) {
  <app-loading-spinner [size]="'lg'" [text]="'rules.loading' | translate" />
} @else {
  <div class="space-y-3">
    @for (rule of rules(); track rule.number) {
      <a
        [routerLink]="rule.id"
        class="group block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:scale-[1.02] hover:border-cyan-500 hover:shadow-xl dark:border-slate-800 dark:bg-slate-900 dark:hover:border-cyan-500">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <!-- Rule Number Badge -->
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-cyan-500 to-blue-500 text-lg font-bold text-white shadow-lg">
              {{ rule.number }}
            </div>

            <!-- Rule Name -->
            <h3 class="text-lg font-semibold text-slate-900 dark:text-white">
              {{ rule.name }}
            </h3>
          </div>

          <!-- Chevron Icon -->
          <fa-icon
            [icon]="faChevronRight"
            class="shrink-0 text-slate-400 transition-all duration-200 group-hover:translate-x-1 group-hover:text-cyan-500 dark:text-slate-600 dark:group-hover:text-cyan-500" />
        </div>
      </a>
    } @empty {
      <app-empty-state [message]="'rules.no_rules' | translate">
        <fa-icon icon [icon]="faFileAlt" size="3x" class="text-slate-400 dark:text-slate-600" />
      </app-empty-state>
    }
  </div>
}
