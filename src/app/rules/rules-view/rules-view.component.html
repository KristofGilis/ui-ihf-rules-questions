@if (loading()) {
  <div class="flex justify-center items-center py-16">
    <div class="flex flex-col items-center gap-4">
      <app-loading-spinner [size]="'lg'" />
      <p class="text-sm text-slate-600 dark:text-slate-400">{{ 'rules.loading' | translate }}</p>
    </div>
  </div>
} @else {
  <div class="space-y-3">
    @for (rule of rules(); track rule.number) {
      <a 
        [routerLink]="rule.id" 
        class="group block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:scale-[1.02] hover:border-cyan-500 hover:shadow-xl dark:border-slate-800 dark:bg-slate-900 dark:hover:border-cyan-500"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <!-- Rule Number Badge -->
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-cyan-500 to-blue-500 text-lg font-bold text-white shadow-lg">
              {{ rule.number }}
            </div>
            
            <!-- Rule Name -->
            <div>
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white">
                {{ rule.name }}
              </h3>
            </div>
          </div>

          <!-- Chevron Icon -->
          <svg 
            class="h-6 w-6 shrink-0 text-slate-400 transition-all duration-200 group-hover:translate-x-1 group-hover:text-cyan-500 dark:text-slate-600 dark:group-hover:text-cyan-500" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </a>
    } @empty {
      <app-empty-state [message]="'rules.no_rules' | translate">
        <svg icon class="h-16 w-16 text-slate-400 dark:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </app-empty-state>
    }
  </div>
}
