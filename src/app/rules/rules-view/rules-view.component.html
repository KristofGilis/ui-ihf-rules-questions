@if (loading()) {
  <div class="flex justify-center items-center py-8">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
  </div>
} @else {
  <div class="space-y-2">
    @for (rule of rules(); track rule.number) {
      <a 
        [routerLink]="rule.id"
        class="block p-4 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-md text-gray-900 dark:text-white transition-colors shadow-sm hover:shadow-md">
        {{ rule.number }} - {{ rule.name }}
      </a>
    }
  </div>
}
