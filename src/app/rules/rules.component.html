<div class="min-h-screen bg-linear-to-br from-slate-50 via-white to-cyan-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-12 pb-24 sm:px-6 lg:px-8">
    <!-- Hero Section -->
    <div class="mb-12 text-center">
      <h1 class="mb-3 text-5xl font-black tracking-tight text-slate-900 dark:text-white md:text-6xl">
        {{ 'rules.title' | translate }}
      </h1>
      <p class="mx-auto max-w-2xl text-lg text-slate-600 dark:text-slate-400">
        {{ 'rules.description' | translate }}
      </p>
    </div>

    <!-- Rules List -->
    <div class="mx-auto max-w-4xl">
      <app-rules-view [rules]="(rules$ | async) ?? []" [loading]="loading()" />
    </div>
  </div>
</div>
