<div class="max-w-4xl mx-auto">
  @if (rule$ | async; as rule) {
    <h2 class="text-3xl font-bold mb-6 text-[rgb(var(--color-text))]">{{ getRuleName(rule) }}</h2>

    <app-questions-view
      [questions]="getQuestions(rule)"
      [loading]="loading()"
      [hasMoreQuestions]="hasMoreQuestions"
      [score]="(score$ | async) ?? undefined"
      [scoreLoading]="scoreLoading()"
      (calculareScore)="onCalculateScore($event.questionIds, $event.selectedAnswerIds)" />
  }
</div>
