<div
  class="overflow-hidden rounded-3xl bg-white shadow-xl ring-1 ring-slate-900/5 dark:bg-slate-900 dark:ring-slate-100/10">
  <div class="bg-linear-to-r from-cyan-500 to-blue-500 px-6 py-4">
    <h2 class="text-xl font-bold text-white">{{ title() }}</h2>
  </div>

  <div class="p-6 space-y-6">
    <!-- Question Count -->
    <div>
      <label class="mb-3 block text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-white">
        {{ 'home.quiz_card.count' | translate }}
      </label>
      <div class="grid grid-cols-4 gap-3">
        @for (count of [10, 15, 20, 30]; track count) {
          <button
            type="button"
            (click)="questionCount.set(count)"
            [class]="
              'group relative overflow-hidden rounded-xl p-4 text-2xl font-bold transition-all ' +
              (questionCount() === count
                ? 'bg-cyan-500 text-white shadow-lg shadow-cyan-500/50 scale-105'
                : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700')
            ">
            <span class="relative z-10">{{ count }}</span>
            @if (questionCount() === count) {
              <div class="absolute inset-0 z-0 bg-linear-to-br from-cyan-400 to-blue-500"></div>
            }
          </button>
        }
      </div>
    </div>

    <!-- Timed Mode -->
    <div class="flex items-center justify-between rounded-xl bg-slate-100 p-4 dark:bg-slate-800">
      <div class="flex items-center gap-3">
        <div class="rounded-lg bg-cyan-100 p-2 dark:bg-cyan-900/30">
          <fa-icon [icon]="faClock" class="text-cyan-600 dark:text-cyan-400" />
        </div>
        <div>
          <div class="font-bold text-slate-900 dark:text-white">{{ 'home.quiz_card.timed_mode' | translate }}</div>
          <div class="text-sm text-slate-600 dark:text-slate-400">
            {{ 'home.timed_mode_description' | translate }}
          </div>
        </div>
      </div>
      <label class="relative inline-block h-8 w-14 cursor-pointer">
        <input type="checkbox" [(ngModel)]="timedMode" class="peer sr-only" aria-label="Toggle timed mode" />
        <div
          class="peer h-8 w-14 rounded-full bg-slate-300 transition-all duration-200 peer-checked:bg-cyan-500 dark:bg-slate-600 dark:peer-checked:bg-cyan-500"></div>
        <div
          class="absolute left-1 top-1 h-6 w-6 rounded-full bg-white shadow-md transition-transform duration-200 peer-checked:translate-x-6"></div>
      </label>
    </div>

    <!-- Start Button -->
    <button
      type="button"
      (click)="onStartQuiz()"
      class="group relative w-full overflow-hidden rounded-xl bg-linear-to-r from-cyan-500 to-blue-500 py-4 text-lg font-bold text-white shadow-lg shadow-cyan-500/50 transition-all hover:scale-[1.02] hover:shadow-xl hover:shadow-cyan-500/60">
      <span class="relative z-10 flex items-center justify-center gap-2">
        {{ 'home.quiz_card.button' | translate }}
        <fa-icon [icon]="faArrowRight" class="transition-transform group-hover:translate-x-1" />
      </span>
    </button>
  </div>
</div>
