<div
  [class]="
    'min-h-screen ' +
    (gradient()
      ? 'bg-linear-to-br from-slate-50 via-white to-cyan-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-900'
      : 'bg-slate-50 dark:bg-slate-950')
  "
>
  <div [class]="'mx-auto px-4 sm:px-6 lg:px-8 ' + maxWidth() + ' ' + padding() + ' '">
    <ng-content />
  </div>
</div>
