<div class="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 py-16 dark:border-slate-700 dark:bg-slate-900">
  @if (iconPath()) {
    <svg class="mb-4 h-16 w-16 text-slate-400 dark:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconPath()" />
    </svg>
  } @else {
    <ng-content select="[icon]" />
  }

  <p class="text-lg font-medium mt-2 text-slate-600 dark:text-slate-400">
    {{ message() }}
  </p>

  @if (hasAction()) {
    <ng-content select="[action]" />
  }
</div>
