<div class="flex items-center justify-center py-16">
  <div class="flex flex-col items-center gap-4">
    <fa-icon [icon]="faSpinner" [animation]="'spin'" [size]="iconSize()" class="text-cyan-500" />
    @if (text()) {
      <p class="text-sm" [class]="textClass()">{{ text() }}</p>
    }
  </div>
</div>
