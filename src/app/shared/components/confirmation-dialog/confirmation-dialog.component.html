<div
  class="dialog-backdrop fixed inset-0 flex items-center justify-center bg-black/50 p-4"
  (click)="onBackdropClick($event)">
  <div
    class="dialog-content w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-700 dark:bg-slate-900"
    (click)="$event.stopPropagation()">
    <h2 class="mb-4 text-xl font-bold text-slate-900 dark:text-white">
      {{ data.title }}
    </h2>
    <p class="mb-6 text-slate-700 dark:text-slate-300">
      {{ data.message }}
    </p>
    <div class="dialog-buttons flex gap-3">
      <app-gradient-button [variant]="'primary'" class="flex-1" (clicked)="handleConfirm()">
        <span>{{ data.confirmText }}</span>
      </app-gradient-button>
      <app-gradient-button [variant]="'success'" class="flex-1" (clicked)="handleCancel()">
        <span>{{ data.cancelText }}</span>
      </app-gradient-button>
    </div>
  </div>
</div>
